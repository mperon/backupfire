# pgbackup configuration template.
# Leave values empty to use built-in defaults.

# Database user (default: postgres).
DB_USER=
# Database host (default: localhost).
DB_HOST=
# Database name (default: postgres).
DB_NAME=
# Database password (default: empty; uses .pgpass/other auth).
DB_PASSWORD=
# Database port (default: 5432)
DB_PORT=

# Max size before splitting (default: 10m).
BK_MAXSIZE=
# Backup destination folder (default: empty; must be set at runtime).
BK_DEST=
# Split command to use (default: split).
BK_SPLIT=
# Days to keep backups (default: 10).
BK_DAYS_TO_KEEP=
# Backup filename prefix (default: bk).
BK_PREFIX=
# Backup filename suffix (default: .enc).
BK_SUFFIX=

# Remote rclone targets array (default: empty).
BK_REMOTE=
# Days between remote uploads (default: 5).
BK_REMOTE_INTERVAL=

# Override pg_dump binary (default: pg_dump).
BK_PGDUMP=
# Plain (unencrypted) backup mode; set to any non-empty value (default: empty).
BK_PLAIN=
# Test mode; set to any non-empty value to validate config (default: empty).
BK_TEST=
# Override openssl binary (default: autodetect).
BK_OPENSSL=
# Override rclone binary (default: autodetect).
BK_RCLONE=
# rclone config file path (default: empty).
BK_RCLONE_CONF=
# Public key path for encryption (default: empty).
BK_PUBKEY_LOC=
