[General]
CronJob="0 3 * * *"
Super=N
BackupLimit=True
KeepWeekly=10
KeepDaily=30
KeepMonthly=12
KeepYearly=5
DateFormat="%Y%m%d%H%M%S"
FilePrefix=bk_
BackupStructure=tree
RemoteDefaultOpts=True
EncryptKey="ssh-rsa "
# Notifications
NotifyTelegram=True
NotifyEmail=True
TelegramToken=
TelegramChatId=
NotifyFailed=True   # set to false to disable
NotifySuccess=True # set to false to disable
NotifyEmailTo=marcosperon@gmail.com

[Database]
Type=Backup
Action=postgres
From=postgres://postgres:mysecretpassword@backupfire-db:5432/invtech_ia
To=/app/data/
Compression=tar.gz
Encrypt=True
EncryptKeyFile=""
Remote=
Skip=False

[VirtualMachines]
Type=Backup
Action=CopyFiles
From=/app/sources/uploads/
To=/app/data/
Compression=tar.gz
Encrypt=True
EncryptKeyFile=
Remote=
Skip=
CronJob=30 2 * * *

[DockerLogs]
Type=Backup
Action=DockerLogs
From=all
To=/app/data/
Compression=tar.gz
Encrypt=True
EncryptKeyFile=
Remote=
Skip=
