[General]
CronJob="0 3 * * *"
Super=N
BackupLimit=True
KeepWeekly=10
KeepDaily=30
KeepMonthly=12
KeepYearly=5
DateFormat="%Y%m%d%H%M%S"
FilePrefix=bk_
BackupStructure=tree
RemoteDefaultOpts=True
EncryptKey="ssh-rsa "

[DatabaseInvtechIA]
Type=Backup
Action=postgres
From=postgres://postgres:mysecretpassword@invtech-db:5432/invtech_ia
To=tmp:/
Compression=tar.gz
Encrypt=True
Remote=pcloud:/Backups/InvtecIA,mega:/Backups/InvtecIA
Skip=False

[PyPoliciaDB]
Type=Backup
Action=postgres
From=postgres://pguser:pgpwd@py-policia-db:5432/policia
To=tmp:/
Compression=tar.gz
Encrypt=True
Remote=pcloud:/Backups/PyPolicia,mega:/Backups/PyPolicia
Skip=False

[VPS_Volumes]
Type=Backup
Action=CopyFiles
From=/srv/volumes
Excludes="db_data/"
To=tmp:/
Compression=tar.gz
Encrypt=True
Remote=pcloud:/Backups/VPS/,mega:/Backups/VPS/
Skip=

[DockerConfig]
Type=Backup
Action=CopyFiles
From=/srv/docker
Excludes=".git/"
To=tmp:/
Compression=tar.gz
Encrypt=True
Remote=pcloud:/Backups/VPS/,mega:/Backups/VPS/
Skip=

[DockerLogs]
Type=Backup
Action=DockerLogs
From=all
To=tmp:/
Compression=tar.gz
Encrypt=True
Remote=pcloud:/Backups/VPS/,mega:/Backups/VPS/
Skip=
