# docker-compose-dev.yml
# Simple dev stack:
# - Postgres for local testing
# - pgbackup container to run backups (one-shot) or cron (set BK_CRON)
#
# Usage:
#   docker compose -f docker-compose-dev.yml up -d postgres
#
# Make sure you have:
#   ./data/   (will store backups)
#   ./config/ (put pubkey.pem and optionally .pgbackup.conf and rclone.conf)

services:
  db:
    image: postgres:16-alpine
    container_name: backupfire-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: invtech_ia
    ports:
      - "5469:5432"
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

