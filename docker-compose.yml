# docker-compose-dev.yml
# Simple dev stack:
# - Postgres for local testing
# - pgbackup container to run backups (one-shot) or cron (set BK_CRON)
#
# Usage:
#   docker compose -f docker-compose-dev.yml up -d postgres
#
# Make sure you have:
#   ./data/   (will store backups)
#   ./config/ (put pubkey.pem and optionally .pgbackup.conf and rclone.conf)
services:
  backupfire-app:
    build:
      context: .
    container_name: backupfire-app
    env_file:
      - .env
    volumes:
      # Mount entire /srv from host into container
      - ./volumes/data:/app/data
      - ./config:/app/config:ro
      # volumes to backup
      - ./volumes/sources:/app/sources:ro
      # Allow running docker CLI against host daemon (only if you need it)
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp
    # Run cron mode (your entrypoint uses this by default, but explicit is nice)
    command: ["run", "-d", "-c", "/app/config/test.conf", "-a"]
    #command: ["cron"]
    depends_on:
      backupfire-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backupfire-db:
    image: postgres:16-alpine3.23
    container_name: backupfire-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: invtech_ia

    ports:
      - "5469:5432"
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
